name: SAST Scan

on:
  push:
  pull_request:

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install semgrep 
      
      - name: Run Semgrep 
        run: semgrep scan --config auto --verbose